# 2026-01-01부터 적용 (국민연금 보험료율 인상분 반영, 기준소득월액 상한/하한은
# 2025년 값 유지 — 2026-07-01에 별도 파일로 갱신됨). 2026-08-01 웹검색으로 확인,
# 출처는 아래 주석 참고. 산재보험료율은 업종이 매우 세분화되어 있어(제조업만도
# 세부업종별로 1.1%~2.4%+ 편차) 여기 값은 대표 예시일 뿐 — 실제 사업장은
# 고용노동부 고시의 정확한 세부업종 코드로 확인 필요.
effective_date: "2026-01-01"

national_pension:
  # 요율 9%→9.5% 인상(2026-01), 근로자부담 절반 = 4.75%
  # 출처: https://www.tossbank.com/articles/nps2026, https://www.daeryunlaw.com/newsletter/amendment/144
  # 상한/하한은 2026-07-01 개정 전까지 2025년 값(637만/40만) 유지
  employee_rate: 0.0475
  income_floor: 400000
  income_cap: 6370000

health_insurance:
  # 건강보험료율 7.09%→7.19% 인상, 근로자부담 절반 = 3.595%
  # 장기요양보험료율(건강보험료 대비) 2025년 12.95%→2026년 13.14%
  # 출처: https://www.mohw.go.kr/board.es?act=view&bid=0027&list_no=1487817 (보건복지부 보도자료)
  employee_rate: 0.03595
  long_term_care_rate: 0.1314

employment_insurance:
  # 근로자부담(실업급여 계정)은 2026년에도 0.9%로 동결
  employee_rate: 0.009

industrial_accident_insurance:
  # 2026년 평균 산재보험료율 1.47%로 3년 연속 동결(고용노동부고시 제2025-91호)
  # 출처: https://www.anjunj.com/news/articleView.html?idxno=41334
  # 아래 업종별 수치는 대표 예시 - 제조업은 세부업종별 편차가 커서 평균값(약 1.3%)을 씀
  rates_by_industry:
    제조업: 0.013
    건설업: 0.035
    도소매업: 0.008
    서비스업: 0.008
  default_rate: 0.0147

non_taxable_allowances:
  meal_allowance_monthly_limit: 200000
  vehicle_allowance_monthly_limit: 200000
