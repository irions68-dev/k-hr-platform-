# Render Blueprint - https://dashboard.render.com/select-repo?type=blueprint
# 대시보드에서 "New +" → "Blueprint"로 이 저장소를 연결하면 이 파일 기준으로 자동 구성됨.
services:
  - type: web
    name: k-hr-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false # 대시보드에서 직접 입력(비밀값이라 이 파일에 안 넣음)
      - key: APP_PASSWORD
        sync: false # 반드시 설정 - 비워두면 인증 없이 인터넷에 노출됨
      - key: ALLOWED_ORIGINS
        sync: false # 예: https://k-hr-guard.pages.dev
